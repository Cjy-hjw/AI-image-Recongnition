name: CI

# PR 到 main 时自动跑;push 到 main 也跑(合并后再保一道)。
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

# 同一分支新 push 取消旧的在跑任务,省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 铁律 1:架构分层契约(import-linter)。纯静态分析,不装重依赖,秒级反馈。
  import-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install import-linter
        run: pip install import-linter==2.12
      - name: Check architecture contracts
        run: lint-imports

  # 铁律 2:Gate 1(verify_model.py 八门)+ 全套 pytest 回归。
  # 直接跑在交付基镜像内 —— torch 2.1.0 / Python 3.10 / weights_only 默认 False,
  # 与离线推理容器完全一致。避免 GitHub runner 临时拼装的 torch 版本漂移
  # (如 torch≥2.6 翻转 weights_only 默认值)导致测出非交付环境的假故障。
  test:
    runs-on: ubuntu-latest
    container: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (file — entrypoint.sh 内容嗅探依赖,与 Dockerfile 保持一致)
        run: apt-get update && apt-get install -y --no-install-recommends file && rm -rf /var/lib/apt/lists/*
      - name: Install runtime + test deps
        run: |
          # 镜像已自带 torch/torchvision 2.1.0,requirements 里的 torch>=2.1.0 已满足
          # (无 --upgrade,pip 跳过不重装)。faiss-cpu 在 py3.10 有 wheel,正常安装。
          pip install -r requirements.txt
          pip install pytest
      - name: Gate 1 - verify_model (8 gates)
        run: python scripts/verify_model.py
      - name: Full pytest regression
        run: pytest -q

  # 铁律 3(2026-07-11 新增):真实 `docker build` + 起容器冒烟测试。
  # 背景:此前 test job 只是在同一基础镜像里手动 pip install「模拟」容器环境,
  # 从未真正 `docker build` 过 Dockerfile 本身——2026-07-11 人工审计发现
  # entrypoint.sh 依赖的 _src_tree_hash.sh 此前一直没被 COPY 进镜像,容器一
  # 启动 entrypoint 就会 source 找不到文件直接崩溃,这个 bug 潜伏期间没有任何
  # CI 检测到。本 job 跑在 host runner(非容器内 job,ubuntu-latest 自带 docker),
  # 补上"镜像真的能 build 出来、entrypoint.sh 真的能在其中跑起来"这道验证。
  # 无真实权重(checkpoints/ 未打进镜像,交付走官方平台人工上传通道,见
  # docs/比赛对齐与风险.md),故只做机制级冒烟(容器能否构建/启动/分发/落盘),
  # 不验证预测数值正确性(数值正确性由 test job 的 Gate1-8 + pytest 覆盖)。
  docker-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t thyroid-infer:ci-test .
      - name: Generate synthetic static image (well-known minimal valid 1x1 PNG)
        run: echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=" | base64 -d > /tmp/smoke_input.png
      - name: Smoke test — static image path (predict.py via entrypoint 分发)
        # 无 authenticity_model.pth,gatekeeper 审计第一步(Authenticity)必然
        # 硬报错(2026-07-10 修复:权重缺失 raise 而非静默随机分类)——预期
        # status=ERROR,这本身就是"容器构建+启动+分发+异常兜底"全链路走通的证明,
        # 不是失败。只要 result.json 落盘且 status/reason 字段完整即视为通过。
        run: |
          mkdir -p /tmp/smoke_out_static
          docker run --rm \
            -v /tmp/smoke_input.png:/workspace/smoke_input.png:ro \
            -v /tmp/smoke_out_static:/workspace/data/output \
            thyroid-infer:ci-test /workspace/smoke_input.png
          echo "--- result.json ---"; cat /tmp/smoke_out_static/result.json
          python3 -c "
          import json
          d = json.load(open('/tmp/smoke_out_static/result.json'))
          assert d.get('status') == 'ERROR', f'预期status=ERROR(容器内无真实权重),实际:{d}'
          assert d.get('reason'), f'reason不应为空: {d}'
          print('OK: 静态图路径冒烟测试通过')
          "
      - name: Generate synthetic cine video (ffmpeg lavfi testsrc,无需外部输入文件)
        # ubuntu-latest runner 不保证预装 ffmpeg,显式装,勿依赖镜像隐式行为
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -f lavfi -i testsrc=duration=1:size=64x64:rate=5 -y /tmp/smoke_input.mp4
      - name: Smoke test — dynamic video path (video_predict.py via entrypoint 分发)
        # --skip_gatekeeper 跳过审计(video_predict.py 独有该flag,predict.py没有);
        # checkpoints/best_model.pth 缺失时 build_model 降级随机初始化(非硬报错,
        # 见 src/inference/AGENTS.md),故完整推理链路应能跑完产出 status=PASSED
        # (预测数值本身无意义,只验证容器机制:分发+完整推理链路+落盘)。
        run: |
          mkdir -p /tmp/smoke_out_video
          docker run --rm \
            -v /tmp/smoke_input.mp4:/workspace/smoke_input.mp4:ro \
            -v /tmp/smoke_out_video:/workspace/data/output \
            thyroid-infer:ci-test /workspace/smoke_input.mp4 --skip_gatekeeper
          echo "--- result.json ---"; cat /tmp/smoke_out_video/result.json
          python3 -c "
          import json
          d = json.load(open('/tmp/smoke_out_video/result.json'))
          assert d.get('status') == 'PASSED', f'预期status=PASSED(random-init模型仍应完整跑完),实际:{d}'
          print('OK: 动态图路径冒烟测试通过')
          "
