name: CI

# PR 到 main 时自动跑;push 到 main 也跑(合并后再保一道)。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一分支新 push 取消旧的在跑任务,省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 铁律 1:架构分层契约(import-linter)。纯静态分析,不装重依赖,秒级反馈。
  import-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install import-linter
        run: pip install import-linter==2.12
      - name: Check architecture contracts
        run: lint-imports

  # 铁律 2:Gate 1(verify_model.py 七门)+ 全套 pytest 回归。
  # 直接跑在交付基镜像内 —— torch 2.1.0 / Python 3.10 / weights_only 默认 False,
  # 与离线推理容器完全一致。避免 GitHub runner 临时拼装的 torch 版本漂移
  # (如 torch≥2.6 翻转 weights_only 默认值)导致测出非交付环境的假故障。
  test:
    runs-on: ubuntu-latest
    container: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime + test deps
        run: |
          # 镜像已自带 torch/torchvision 2.1.0,requirements 里的 torch>=2.1.0 已满足
          # (无 --upgrade,pip 跳过不重装)。faiss-cpu 在 py3.10 有 wheel,正常安装。
          pip install -r requirements.txt
          pip install pytest
      - name: Gate 1 - verify_model (7 gates)
        run: python scripts/verify_model.py
      - name: Full pytest regression
        run: pytest -q
