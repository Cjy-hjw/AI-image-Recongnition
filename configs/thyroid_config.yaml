# Configuration for Thyroid AI Detection Pipeline
# Optimized for NVIDIA A800 80GB GPU

environment:
  device: "cuda"            # cuda or cpu
  seed: 42
  num_workers: 12            # Enable multi-threaded data loading (recommended for speed)

data:
  train_path: "data/train"
  val_path: "data/val"
  holdout_path: "data/holdout"
  batch_size: 64              # Reduced from 128 to prevent NaN accumulation
  img_size: 512             # Resized resolution。注意:该值烘焙进 checkpoint(prior_extractor.x_coords/y_coords
                            # 按 img_size 存的固定形状 buffer),换分辨率≠热插拔——实测 512→1024 直接 load_state_dict
                            # size mismatch 报错(2026-07-11 A800 80G 复核验证)。当前所有已训练 checkpoint 均为
                            # 512;若要上 1024 必须用该分辨率重新训练/生成新 checkpoint,不能只改这个数字。

# Post-hoc 置信度校准(温度缩放)。param_file 缺失时全任务 T=1.0(不校准,输出不变);
# 初赛真实数据到位后用 src/inference/calibration.fit_temperature 在独立验证集拟合 T 写入。
calibration:
  param_file: "checkpoints/calibration.json"

gatekeeper:
  # 审计命中后的处置模式(主开关):
  #   soft(默认,交付值) — 命中只作 flag 写进 result.json,诊断照常输出;
  #   hard              — 去重/篡改命中即 REJECTED,不输出任何诊断字段。
  # 默认 soft 的依据:2026-07-28 官方赛前动员会明确赛道七豁免全部医保安全考核,
  # 总分 = 临床诊断得分 Sclin × 100,gatekeeper 零计分贡献;且"真实病例被误判为
  # 伪造,诊断结果仍参与目标三四五计分"(前提是必须先输出诊断)。故硬拒绝已成
  # 纯负期望——拒对零收益,误拒一次白丢该病例全部临床得分。hard 仅供回归测试与
  # 未来规则变化时启用(非法值一律降级 soft,见 gatekeeper_runner.resolve_enforcement_mode)。
  #
  # ⚠️ 本项与下方 `bag_hard_reject` 是**两把独立的锁**,只切一把不会生效:
  #   enforcement_mode 决定"硬判据命中后是否 REJECTED";
  #   bag_hard_reject  决定"BAG 相位命中算不算硬判据"(false 时只进 soft_flags)。
  # 故 `enforcement_mode: hard` + `bag_hard_reject: false` 下,BAG 命中**仍不拒绝**——
  # 想让 BAG 真正参与拒绝,两处都要切。切换时务必同时确认另一处。
  enforcement_mode: soft
  fpr_threshold: 0.01
  precision_threshold: 0.98
  phash_threshold: 1        # Hamming distance limit
  # 余弦近重复阈值,按激活后端分别取值(单一标量无法同时服务两后端):
  #   sscd 0.86     — SSCD 描述符对裁切/水印/色调偏移近似不变,0.86 治近重复漏检
  #                   (官方 README 给 0.75@90%精度,取更严的 0.86 压误报);
  #   resnet18 0.995 — 降级后端守一票否决红线「宁可漏检不可误杀真实影像」,故调严。
  cosine_threshold:
    sscd: 0.86
    resnet18: 0.995
  faiss_dim: 512            # 描述符维度(SSCD/ResNet18 均 512;实际以后端实测维度建索引)
  # sscd_weights:           # 可选,显式指定 SSCD TorchScript 路径;缺省自动探测 checkpoints/
  # catnet_weights:         # 可选,CAT-Net v2 TorchScript 路径;缺省探测 checkpoints/catnet_v2.torchscript.pt
                            #   缺失则降级 dct-bag(纯 NumPy 块伪影栅格取证),detect() 仍含几何检测器并集
  # BAG 相位取证是否作硬拒绝。默认 false(仅软 flag,进 result.json 的
  # gatekeeper.soft_flags)——BAG 阈值仅经 8 个合成种子小样本验证,远小于
  # copy_move/splice 的 359 张真实图验证量级。恢复硬拒绝的唯一闸门:官方真实干净
  # JPG holdout 上预注册、带置信区间的 FPR 验收达标
  # (统一软flag制度,见 docs/P2红线修复实施计划.md B3)。
  #
  # ⚠️ 与上方 `enforcement_mode` 是**两把独立的锁**:本项只决定"BAG 命中算不算
  # 硬判据",即使置 true,也还要 `enforcement_mode: hard` 才会真的 REJECTED。
  # 反之 `enforcement_mode: hard` 单独切换不会让 BAG 参与拒绝。切一处前先看另一处。
  # 注:copy_move/splice 无对应开关——二者**恒为软判据**(真实图误报 27.3%),
  # 无论两把锁怎么切都只进 soft_flags,不驱动 would_reject_in_hard_mode。
  bag_hard_reject: false
  tamper_threshold: 0.5

model:
  backbone: "efficientnet_b2"      # Backbone optimized for multi-task thyroid diagnostic
  pretrained: true
  num_classes_composition: 4 # cystic, spongiform, mixed, solid
  num_classes_echogenicity: 4 # anechoic, hyperechoic/isoechoic, hypoechoic, very hypoechoic
  num_classes_shape: 2        # wider-than-tall, taller-than-wide
  num_classes_margin: 4       # smooth, ill-defined, lobulated/irregular, extrathyroidal extension
  num_classes_foci: 4         # none/comet-tail, large coarse, peripheral/rim, punctate echogenic
  num_classes_malignancy: 2   # benign, malignant
  # ── 官方新增三维度（Phase2 三头）──────────────────────────────────────────
  num_classes_location: 7     # 1左上 2左中 3左下 4右上 5右中 6右下 7峡部（顺序权威见 src/models/label_schema.py）
  num_classes_ete: 4          # 1无 2甲状腺包膜 3毗邻软组织 4血管
                              # 🔴 保 4 类不并类：血管仅 5 例，若官方指标是 Macro-AUC，
                              # 并类会让该类 AUC 无从计算（= 直接丢该项分）。要翻此决定
                              # 必须先拿到官方评测口径，不是配置偏好。
  num_classes_clin_t: 2       # 0 非临床显著 / 1 临床显著

train:
  epochs: 120                # 120 Epochs for full convergence on server
  lr: 0.0024                 # Tuned for batch size 128
  weight_decay: 0.0005
  amp: true                 # Automatic Mixed Precision
  early_stopping_patience: 35
  checkpoint_w_dice: 0.30
  checkpoint_w_auc: 0.70
  stage3_early_stopping_patience: 0   # 0 = disable Stage3 early stopping, run full 101-120
  label_smoothing: 0.0        # Disabled to reduce training instability
  cbm_dropout: 0.3
  slr_beta: 0.99            # Supervised Label Rectification smoothing factor
  slr_threshold: 2.0        # SLR gradient threshold
  # Next-Gen Rebuilding Parameters
  supcon_temperature: 0.07
  slr_alpha: 0.1
  prior_mlp_dim: 16
  physical_kappa: 100.0

  # ── 侵犯头（ETE）不平衡校正超参（Phase2 阶段 2.2）────────────────────────────
  # ETE 是全项目最极端的不平衡任务：3906/267/67/5（无/包膜/软组织/血管），
  # 最稀有类占 0.12%。裸 CE 下恒输出"无侵犯"即可拿 92% 准确率，三个有临床意义的
  # 类全部学不到。下面两项是两种校正手段，实现见
  # src/models/losses/components/extension.py。
  #
  # ⚠️ 二者是同一问题的两种解法（Menon 原文把 Logit Adjustment 作为重加权的*替代*
  # 提出），**同时开满会过校正**。故当前只开 CB-Focal，la_tau 留 0。
  ete_class_counts: [3906, 267, 67, 5]   # 官方全量实测（docs/训练数据定稿.md:85）
                                         # 换数据集/换划分后必须重算，否则先验与实际不符、
                                         # 校正方向对但幅度错（不会报错）。
  ete_cb_beta: 0.99         # 🔴 不要抄论文的 0.9999。实跑 class_balanced_weights 的权重比
                            # （血管:无）：β=0.9→2.4:1  β=0.99→20.4:1  β=0.999→196.4:1
                            # β=0.9999→646.9:1。n=5 时 0.9999 退化成近似逆频率加权，
                            # 等于让 5 张图吃掉整个损失、必然过拟合。0.0 = 关闭加权。
  ete_focal_gamma: 2.0      # Focal 的 γ；0 = 退化为普通加权 CE
  ete_la_tau: 0.0           # Logit Adjustment 的 τ，**0 = 关闭**。>0 时训练损失用
                            # CE(logits + τ·log π, y)（是**加**不是减；符号反了会放大
                            # 不平衡且损失照常下降）。推理侧不得再调一次。
                            # 待官方验证集到手后再调——官方数据只在云端，本地无从验证。
