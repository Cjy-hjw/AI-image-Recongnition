# Configuration for Thyroid AI Detection Pipeline
# Optimized for NVIDIA A800 80GB GPU

environment:
  device: "cuda"            # cuda or cpu
  seed: 42
  num_workers: 12            # Enable multi-threaded data loading (recommended for speed)

data:
  train_path: "data/train"
  val_path: "data/val"
  holdout_path: "data/holdout"
  batch_size: 64              # Reduced from 128 to prevent NaN accumulation
  img_size: 512             # Resized resolution (set to 512 or 1024 for A800 80GB)

# Post-hoc 置信度校准(温度缩放)。param_file 缺失时全任务 T=1.0(不校准,输出不变);
# 初赛真实数据到位后用 src/inference/calibration.fit_temperature 在独立验证集拟合 T 写入。
calibration:
  param_file: "checkpoints/calibration.json"

gatekeeper:
  fpr_threshold: 0.01
  precision_threshold: 0.98
  phash_threshold: 1        # Hamming distance limit
  cosine_threshold: 0.995   # Cosine similarity limit for deep features
  faiss_dim: 512            # ResNet18 feature dimension
  tamper_threshold: 0.5

model:
  backbone: "efficientnet_b2"      # Backbone optimized for multi-task thyroid diagnostic
  pretrained: true
  num_classes_composition: 4 # cystic, spongiform, mixed, solid
  num_classes_echogenicity: 4 # anechoic, hyperechoic/isoechoic, hypoechoic, very hypoechoic
  num_classes_shape: 2        # wider-than-tall, taller-than-wide
  num_classes_margin: 4       # smooth, ill-defined, lobulated/irregular, extrathyroidal extension
  num_classes_foci: 4         # none/comet-tail, large coarse, peripheral/rim, punctate echogenic
  num_classes_malignancy: 2   # benign, malignant

train:
  epochs: 120                # 120 Epochs for full convergence on server
  lr: 0.0024                 # Tuned for batch size 128
  weight_decay: 0.0005
  amp: true                 # Automatic Mixed Precision
  early_stopping_patience: 35
  checkpoint_w_dice: 0.30
  checkpoint_w_auc: 0.70
  stage3_early_stopping_patience: 0   # 0 = disable Stage3 early stopping, run full 101-120
  label_smoothing: 0.0        # Disabled to reduce training instability
  cbm_dropout: 0.3
  slr_beta: 0.99            # Supervised Label Rectification smoothing factor
  slr_threshold: 2.0        # SLR gradient threshold
  # Next-Gen Rebuilding Parameters
  supcon_temperature: 0.07
  slr_alpha: 0.1
  prior_mlp_dim: 16
  physical_kappa: 100.0
